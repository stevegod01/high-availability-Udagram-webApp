AWSTemplateFormatVersion: '2010-09-09'
Description: Disposable EC2 Apache and EBS lab; separate from the Udagram stacks
Parameters:
  HttpCidr:
    Type: String
    Description: Your public IPv4 /32 or other explicitly chosen HTTP client CIDR
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties: {CidrBlock: 10.60.0.0/16, EnableDnsSupport: true, EnableDnsHostnames: true}
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway}
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.60.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  Route:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: {RouteTableId: !Ref RouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway}
  RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref Subnet, RouteTableId: !Ref RouteTable}
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Explicit HTTP client access; administration through SSM
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref HttpCidr}
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore']
  Profile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref Role]}
  Instance:
    Type: AWS::EC2::Instance
    DependsOn: [Route, RouteAssociation]
    Properties:
      ImageId: !Ref ImageId
      InstanceType: t3.micro
      IamInstanceProfile: !Ref Profile
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref SecurityGroup]
      MetadataOptions: {HttpTokens: required, HttpEndpoint: enabled}
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 8, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-apache'}]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          dnf install -y httpd
          printf '%s\n' '<h1>EC2 Apache and EBS lab</h1>' > /var/www/html/index.html
          systemctl enable --now httpd
  DataVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !GetAtt Instance.AvailabilityZone
      Size: 8
      VolumeType: gp3
      Encrypted: true
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-lab-data'}]
  Attachment:
    Type: AWS::EC2::VolumeAttachment
    Properties: {Device: /dev/sdf, InstanceId: !Ref Instance, VolumeId: !Ref DataVolume}
Outputs:
  InstanceId: {Value: !Ref Instance}
  DataVolumeId: {Value: !Ref DataVolume}
  Website: {Value: !Sub 'http://${Instance.PublicIp}'}
  AvailabilityZone: {Value: !GetAtt Instance.AvailabilityZone}
