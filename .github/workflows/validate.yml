name: Infrastructure validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-validation.txt
      - run: cfn-lint UdagranInfrastructure.yaml UdagramServers.yaml labs/ec2-apache-ebs/template.yaml labs/recovery/*.yaml
      - run: python -m unittest discover -s tests -v
      - run: bash -n labs/ec2-apache-ebs/mount-data-volume.sh
      - run: bash tests/test_mount_data_volume.sh
      - run: shellcheck labs/ec2-apache-ebs/mount-data-volume.sh
